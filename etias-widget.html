<meta name="robots" content="noindex,nofollow">
<!--
  ETIAS WIDGET DE CAPTURA v1.0
  Embeber en cada página programática: etias-[pais]-[destino].html
  
  PARÁMETROS SOPORTADOS POR EL SIMULADOR:
  ?q=     → consulta libre (búsqueda larga completa)
  ?pais=  → nacionalidad pre-cargada
  ?destino= → destino pre-cargado
  ?lang=  → idioma (es|en|pt)
  
  EJEMPLOS DE URL GENERADA:
  ?q=soy mexicano y viajo a España en julio
  ?pais=brasil&destino=portugal&lang=pt
  ?q=necesito etias para viajar con mi hijo menor
-->

<!-- WIDGET ESTÁNDAR (para páginas en español) -->
<div style="
  background: linear-gradient(135deg, #0c1e35 0%, #1a3a5c 100%);
  border-radius: 14px;
  padding: 22px 20px;
  max-width: 480px;
  margin: 28px auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  font-family: Georgia, serif;
">
  <p style="color:#C9A84C;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin:0 0 6px">
    Asistente ETIAS · Consulta gratuita
  </p>
  <p style="color:#e5e7eb;font-size:13px;margin:0 0 14px;line-height:1.4">
    Cuéntanos tu caso y verificamos tu elegibilidad en segundos.
  </p>
  <input
    id="etias-widget-q"
    type="text"
    placeholder="Ej: Soy mexicano y viajo a España en julio"
    style="
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1.5px solid #C9A84C;
      font-size: 14px;
      font-family: Georgia, serif;
      color: #1f2937;
      background: #f9fafb;
      box-sizing: border-box;
      margin-bottom: 10px;
    "
    onkeydown="if(event.key==='Enter') etiasWidgetAbrir()"
  />
  <button
    onclick="etiasWidgetAbrir()"
    style="
      width: 100%;
      background: #C9A84C;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: Georgia, serif;
      letter-spacing: 0.03em;
    "
  >
    Verificar elegibilidad →
  </button>
  <p style="color:#9ca3af;font-size:10px;margin:8px 0 0;text-align:center">
    🔒 Art. 67 Reg. UE 2018/1240 · ETIAS lanza Q4 2026
  </p>
</div>

<script>
function etiasWidgetAbrir() {
  var q = document.getElementById("etias-widget-q").value.trim();
  if (!q) return;
  var base = "https://etias.netlify.app/";
  window.location.href = base + "?q=" + encodeURIComponent(q);
}
</script>
