        .header {

        .header h1 { color: #1e3a5f; font-size: 24px; }
        .header p { color: #666; font-size: 14px; margin-top: 5px; }
        
        .lang-selector {

            display: flex;
            gap: 8px;
            margin-top: -40px;
        }
        .lang-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #1e3a5f;
            background: white;
            color: #1e3a5f;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .lang-btn.active { background: #1e3a5f; color: white; }
        
        .steps {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .step {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .step-num.active { background: #1e3a5f; color: white; }
        .step-num.done { background: #22c55e; color: white; }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { color: #1e3a5f; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        
        .section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }
        .section-title {
            color: #1e3a5f;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .field { margin-bottom: 12px; }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .field-hint { color: #ef4444; font-size: 11px; margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1e3a5f;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .lang-selector { float: none; margin: 10px 0; }
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #1e3a5f; color: white; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        
        .warning-box {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .warning-box label { display: flex; align-items: flex-start; gap: 10px; }
        .warning-box input { width: auto; margin-top: 3px; }
        .warning-text { color: #92400e; font-size: 13px; }
        
        .dropzone {
            border: 3px dashed #f59e0b;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #fffbeb;
            margin-bottom: 20px;
        }
        .dropzone-icon { font-size: 48px; margin-bottom: 10px; }
        .dropzone-title { color: #1e3a5f; font-weight: bold; margin-bottom: 5px; }
        .dropzone-subtitle { color: #666; font-size: 12px; }
        
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .status-loading { background: #dbeafe; color: #1e40af; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-success { background: #d1fae5; color: #166534; }

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

            .d-grid { grid-template-columns: repeat(2, 1fr); }

            border-radius: 8px;
            padding: 16px;
            text-align: center;

        .d-desc { color: #64748b; font-size: 11px; }
        
        .checks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .checks { grid-template-columns: 1fr; }
        }
        .check {
            display: flex;

            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        .check.pass { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
        .check.fail { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
        .check-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0; }
        .check.pass .check-icon { background: #22c55e; color: white; }
        .check.fail .check-icon { background: #ef4444; color: white; }

        .alert-error { background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
        .alert-success { background: #f0fdf4; border: 1px solid #22c55e; color: #166534; }
        .alert-title { font-weight: bold; margin-bottom: 5px; }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .review-grid { grid-template-columns: 1fr; }

        .review-box strong { color: #1e3a5f; }
        .review-label { color: #64748b; font-size: 10px; text-transform: uppercase; font-weight: bold; }

            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;

            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 8px;

        .toggle-btns { display: flex; gap: 6px; }
        .toggle-btn {

            font-weight: bold;

        }

        function setLang(lang) {
            currentLang = lang;

        function updateRep(key, value) {
            repData[key] = value;
            render();

        function updateTraveler(key, value) {
            travelerData[key] = value;

        }

        function handleFile(file) {
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('File too large (max 5MB)');
                return;
            }
            ocrState = { loading: true, error: null, data: null };
            render();
            setTimeout(function() {
                ocrState = { loading: false, error: true, data: null };
                render();
            }, 1500);
        }

        function runValidation() {
            var etiasZones = ['españa','spain','espanha','francia','france','frança','alemania','germany','alemanha','italia','italy','itália','portugal','paises bajos','netherlands','holanda','bélgica','belgium','belgica','suiza','switzerland','suíça','austria','noruega','norway','dinamarca','denmark','suecia','sweden','suécia','finlandia','finland','irlanda','ireland'];
            
            var dest = (travelerData.destination || '').toLowerCase();
            var isEtias = false;
            for (var i = 0; i < etiasZones.length; i++) {
                if (dest.indexOf(etiasZones[i]) !== -1) {
                    isEtias = true;
                    break;
                }
            }
            
            var checks = {
                d1_1: repData.consultantName.length > 2,
                d1_2: repData.travelerEmail !== repData.consultantEmail && repData.travelerEmail.indexOf('@') !== -1,
                d1_3: repData.signed,
                d2_1: travelerData.expiryDate && new Date(travelerData.expiryDate) > new Date(Date.now() + 90*24*60*60*1000),
                d2_2: travelerData.arrivalDate && new Date(travelerData.arrivalDate) > new Date(),
                d2_3: isEtias || travelerData.destination.length > 2,
                d3_1: !travelerData.refused && !travelerData.deported && !travelerData.criminal,
                d3_2: travelerData.passportNumber === repData.passportNumber && travelerData.passportNumber.length > 5,
                d3_3: repData.fee && parseFloat(repData.fee) > 0,
                d4_1: true, d4_2: true, d4_3: true
            };
            
            var failed = [];
            for (var key in checks) {
                if (!checks[key]) failed.push(key);
            }
            return { checks: checks, failed: failed, passed: failed.length === 0 };
        }

        function generatePDF() {
            pdfState = 'generating';
            render();
            
            try {
                var jsPDF = window.jspdf.jsPDF;
                var doc = new jsPDF();
                var W = 210, M = 20, CW = W - M * 2;
                var y = 20;
                var expId = 'ETIAS-' + Date.now().toString(36).toUpperCase();
                var today = new Date().toLocaleDateString();
                var tx = T[currentLang];
                
                // Header
                doc.setFillColor(30, 58, 95);
                doc.rect(0, 0, W, 40, "F");
                doc.setTextColor(201, 168, 76);
                doc.setFontSize(20);
                doc.setFont("helvetica", "bold");
                doc.text(tx.rep.title.toUpperCase(), M, 18);
                doc.setFontSize(10);
                doc.setTextColor(200, 200, 200);
                doc.text("Art. 67, Regulation (EU) 2018/1240", M, 26);
                doc.setTextColor(150, 150, 150);
                doc.text("Ref: " + expId + " | " + today, M, 34);
                y = 50;

                function section(title) {
                    doc.setFillColor(30, 58, 95);
                    doc.rect(M, y, CW, 8, "F");
                    doc.setTextColor(201, 168, 76);
                    doc.setFontSize(11);
                    doc.setFont("helvetica", "bold");
                    doc.text(title, M + 4, y + 5.5);
                    y += 14;
                }

                function row(label, value) {
                    doc.setFillColor(245, 245, 245);
                    doc.rect(M, y, 60, 7, "F");
                    doc.setTextColor(100, 100, 100);
                    doc.setFontSize(9);
                    doc.setFont("helvetica", "bold");
                    doc.text(label, M + 3, y + 5);
                    doc.setTextColor(30, 30, 30);
                    doc.setFont("helvetica", "normal");
                    var text = String(value || "—");
                    var lines = doc.splitTextToSize(text, CW - 68);
                    doc.text(lines, M + 65, y + 5);
                    y += 9;
                }

                // I. Intermediary
                section(currentLang === 'es' ? "I. INTERMEDIARIO" : currentLang === 'pt' ? "I. INTERMEDIÁRIO" : "I. INTERMEDIARY");
                row("Name:", repData.consultantName);
                row("Email:", repData.consultantEmail);
                row("Company:", repData.company);
                row("Fee:", "€" + repData.fee);
                y += 6;

                // II. Traveller
                section(currentLang === 'es' ? "II. VIAJERO" : currentLang === 'pt' ? "II. VIAJANTE" : "II. TRAVELLER");
                row("Name:", repData.travelerName);
                row("Passport:", repData.passportNumber);
                row("Nationality:", travelerData.nationality);
                row("DOB:", travelerData.dob);
                row("Type:", tx.rep.relations[repData.relation]);
                row("Destination:", travelerData.destination);
                row("Arrival:", travelerData.arrivalDate);
                y += 6;

                // III. Declaration
                section(currentLang === 'es' ? "III. DECLARACIÓN" : currentLang === 'pt' ? "III. DECLARAÇÃO" : "III. DECLARATION");
                doc.setTextColor(30, 30, 30);
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                
                var decl = currentLang === 'es'
                    ? "Yo, " + repData.travelerName + ", autorizo a " + repData.consultantName + " para presentar mi solicitud ETIAS."
                    : currentLang === 'pt'
                    ? "Eu, " + repData.travelerName + ", autorizo " + repData.consultantName + " a apresentar o meu pedido ETIAS."
                    : "I, " + repData.travelerName + ", authorise " + repData.consultantName + " to submit my ETIAS application.";
                
                var lines = doc.splitTextToSize(decl, CW);
                doc.text(lines, M, y);
                y += lines.length * 5 + 10;

                // IV. Signatures
                section(currentLang === 'es' ? "IV. FIRMAS" : currentLang === 'pt' ? "IV. ASSINATURAS" : "IV. SIGNATURES");
                var bw = (CW - 10) / 2;
                
                // Box 1
                doc.rect(M, y, bw, 35);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.setTextColor(30, 58, 95);
                doc.text(currentLang === 'es' ? "Intermediario" : currentLang === 'pt' ? "Intermediário" : "Intermediary", M + bw/2, y + 8, {align:"center"});
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(80, 80, 80);
                doc.text(repData.consultantName, M + bw/2, y + 16, {align:"center"});
                doc.setDrawColor(180, 180, 180);
                doc.line(M + 10, y + 28, M + bw - 10, y + 28);
                doc.text(today, M + bw/2, y + 33, {align:"center"});
                
                // Box 2
                doc.rect(M + bw + 10, y, bw, 35);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(30, 58, 95);
                doc.text(currentLang === 'es' ? "Viajero" : currentLang === 'pt' ? "Viajante" : "Traveller", M + bw + 10 + bw/2, y + 8, {align:"center"});
                doc.setFont("helvetica", "normal");
                doc.text(repData.travelerName, M + bw + 10 + bw/2, y + 16, {align:"center"});
                doc.line(M + bw + 20, y + 28, M + 2*bw + 10, y + 28);
                doc.text(today, M + bw + 10 + bw/2, y + 33, {align:"center"});
                
                y += 45;

                // Footer
                doc.setFillColor(30, 58, 95);
                doc.rect(0, 280, W, 17, "F");
                doc.setTextColor(180, 180, 180);
                doc.setFontSize(8);
                doc.text("ETIAS Consultant Simulator | " + CONSULTANT_EMAIL + " | Educational Only", W/2, 290, {align:"center"});

                doc.save("ETIAS-" + expId + ".pdf");
                pdfState = 'downloaded';
                render();
                setTimeout(function() { pdfState = 'idle'; render(); }, 2000);
            } catch (e) {
                console.error(e);
                alert('PDF Error: ' + e.message);
                pdfState = 'idle';
                render();
            }
        }

            var t = T[currentLang];

            for (var i = 0; i < t.steps.length; i++) {
                var cls = i === currentStep ? 'active' : i < currentStep ? 'done' : '';
                var num = i < currentStep ? '✓' : (i + 1);
                html += '<div class="step"><span class="step-num ' + cls + '">' + num + '</span>' + t.steps[i] + '</div>';
            }
            html += '</div>';
            return html;

                    html += '<div class="toggle-btns">';
                    html += '<button class="toggle-btn yes ' + (travelerData[key] ? 'active' : '') + '" onclick="updateTraveler(\'' + key + '\',true)">' + t.td.yes + '</button>';
                    html += '<button class="toggle-btn no ' + (!travelerData[key] ? 'active' : '') + '" onclick="updateTraveler(\'' + key + '\',false)">' + t.td.no + '</button>';
                    html += '</div></div>';
                }
                html += '</div>';
                
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<button class="btn btn-secondary" onclick="currentStep=1;render()">← Back</button>';
                html += '<button class="btn btn-primary" onclick="currentStep=3;render()">' + t.td.next + '</button>';
                html += '</div>';
            }
            else if (currentStep === 3) {
                var v = runValidation();
                html += '<h2>' + t.val.title + '</h2>';
                html += '<p class="subtitle">' + t.val.sub + '</p>';
                
                html += '<div class="d-grid">';
                var dKeys = ['d1', 'd2', 'd3', 'd4'];
                for (var i = 0; i < dKeys.length; i++) {
                    var dk = dKeys[i];
                    html += '<div class="d-card"><div class="d-title">' + t.val.dNames[dk] + '</div><div class="d-desc">' + t.val.dDescs[dk] + '</div></div>';
                }
                html += '</div>';
                
                html += '<div class="checks">';
                var checkKeys = Object.keys(t.val.checks);
                for (var i = 0; i < checkKeys.length; i++) {
                    var ck = checkKeys[i];
                    var pass = v.checks[ck];
                    html += '<div class="check ' + (pass ? 'pass' : 'fail') + '"><span class="check-icon">' + (pass ? '✓' : '!') + '</span><span>' + t.val.checks[ck] + '</span></div>';
                }
                html += '</div>';
                
                if (!v.passed) {
                    html += '<div class="alert alert-error"><div class="alert-title">' + t.val.fail + '</div>' + t.val.failDesc + '</div>';
                } else {
                    html += '<div class="alert alert-success"><div class="alert-title">' + t.val.ok + '</div></div>';
                }
                
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<button class="btn btn-secondary" onclick="currentStep=2;render()">← Back</button>';
                html += '<button class="btn btn-primary" onclick="currentStep=4;render()" ' + (v.passed ? '' : 'disabled') + '>' + t.val.next + '</button>';
                html += '</div>';
            }
            else if (currentStep === 4) {
                html += '<h2>' + t.rev.title + '</h2>';
                html += '<p class="subtitle">' + t.rev.sub + '</p>';
                
                html += '<div class="warning-box">';
                html += '<span class="warning-text">' + t.rev.warn + '</span>';
                html += '</div>';
                
                html += '<div class="review-grid">';
                html += '<div class="section">';
                html += '<div class="section-title">' + t.rev.rLabel + '</div>';
                html += '<div class="review-box">';
                html += '<strong>' + repData.consultantName + '</strong>';
                html += '<div style="color:#666;margin:4px 0">' + repData.consultantEmail + '</div>';
                html += '<div style="color:#666">' + (repData.company || '—') + '</div>';
                html += '<div style="margin-top:12px;padding-top:12px;border-top:2px solid #e2e8f0"><span class="review-label">Fee:</span> €' + repData.fee + '</div>';
                html += '</div></div>';
                
                html += '<div class="section">';
                html += '<div class="section-title">' + t.rev.tLabel + '</div>';
                html += '<div class="review-box">';
                html += '<strong>' + repData.travelerName + '</strong>';
                html += '<div style="color:#666;margin:4px 0">' + repData.travelerEmail + '</div>';
                html += '<div style="color:#666">' + t.rep.relations[repData.relation] + '</div>';
                html += '<div style="margin-top:12px;padding-top:12px;border-top:2px solid #e2e8f0">';
                html += '<div><span class="review-label">Passport:</span> ' + repData.passportNumber + '</div>';
                html += '<div><span class="review-label">Expires:</span> ' + travelerData.expiryDate + '</div>';
                html += '<div><span class="review-label">To:</span> ' + travelerData.destination + '</div>';
                html += '</div></div></div>';
                html += '</div>';
                
                html += '<div style="padding:20px;background:#f0fdf4;border-radius:12px;color:#166534;text-align:center;font-weight:700;margin-bottom:24px">';
                html += '✓ ' + t.rev.valOk;
                html += '</div>';
                
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<button class="btn btn-secondary" onclick="currentStep=3;render()">← Back</button>';
                html += '<button class="btn btn-primary" onclick="currentStep=5;render()">' + t.rev.submit + '</button>';
                html += '</div>';
            }
            else if (currentStep === 5) {
                var expId = 'ETIAS-' + Date.now().toString(36).toUpperCase();
                html += '<div class="success-icon">✓</div>';
                html += '<h2 style="text-align:center">' + t.conf.title + '</h2>';
                html += '<p class="subtitle" style="text-align:center">' + t.conf.sub + '</p>';
                
                html += '<div class="file-id">';
                html += '<div class="file-id-label">' + t.conf.idLabel + '</div>';
                html += '<div class="file-id-value">' + expId + '</div>';
                html += '</div>';
                
                html += '<div style="margin-bottom:24px">';
                html += '<h3 style="color:#1e3a5f;margin-bottom:16px;padding-bottom:12px;border-bottom:3px solid #f59e0b">' + t.conf.pdfTitle + '</h3>';
                var btnText = pdfState === 'idle' ? t.conf.pdfBtn : (pdfState === 'generating' ? '<span class="spinner"></span> ' + t.conf.pdfGen : '✓ ' + t.conf.pdfOk);
                html += '<button class="btn btn-primary" onclick="generatePDF()" style="width:100%;justify-content:center" ' + (pdfState !== 'idle' ? 'disabled' : '') + '>' + btnText + '</button>';
                html += '</div>';
                
                html += '<div class="steps-list">';
                html += '<h3>' + t.conf.stepsTitle + '</h3>';
                html += '<ol>';
                for (var i = 0; i < t.conf.steps.length; i++) {
                    html += '<li>' + t.conf.steps[i] + '</li>';
                }
                html += '</ol></div>';
                
                html += '<div class="note">' + t.conf.note + '</div>';
                html += '<button class="btn btn-primary" onclick="reset()" style="width:100%;justify-content:center">' + t.conf.newBtn + '</button>';
            }
            
            html += '</div>'; // close card
            
            // Footer
            html += '<div class="footer">';
            html += '<p><a href="' + REPO_URL + '" target="_blank">GitHub Repository</a> · ' + CONSULTANT_EMAIL + '</p>';
            html += '<p style="margin-top:8px">Educational simulator · Not affiliated with the EU</p>';
            html += '</div>';
            
            app.innerHTML = html;
        }

        // Initialize
        render();
    </script>
</body>
</html>
