<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requisitos ETIAS 2026: validación y simulador</title>
  <meta name="description" content="Valida si cumples los requisitos ETIAS 2026, detecta riesgos y recibe tu resultado por email.">

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("service_hxuq7gn");
    })();
  </script>
</head>

<body>

<h1>Requisitos ETIAS 2026</h1>

<p>Evalúa tu elegibilidad y recibe un diagnóstico antes de aplicar.</p>

<hr>

<h2>Simulador rápido</h2>

<form id="formulario">

<label>Email:</label><br>
<input type="email" id="email" required><br><br>

<label>Edad:</label><br>
<input type="number" id="edad" required><br><br>

<label>Pasaporte vigente:</label><br>
<select id="pasaporte">
  <option value="si">Sí</option>
  <option value="no">No</option>
</select><br><br>

<label>Rechazos previos:</label><br>
<select id="rechazo">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select><br><br>

<label>Antecedentes:</label><br>
<select id="antecedentes">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select><br><br>

<button type="button" onclick="evaluar()">Evaluar y enviar</button>

</form>

<h3>Resultado:</h3>
<p id="resultado">Pendiente</p>

<hr>

<h2>Información clave</h2>
<ul>
  <li>Costo: 20 euros</li>
  <li>Tiempo: minutos a 30 días</li>
  <li>Validez: 3 años</li>
</ul>

<p><a href="etias-costo.html">Costo ETIAS</a></p>
<p><a href="etias-cuanto-tarda.html">Tiempo de aprobación</a></p>

<hr>

<script>
function evaluar() {

  let email = document.getElementById("email").value;
  let edad = document.getElementById("edad").value;
  let pasaporte = document.getElementById("pasaporte").value;
  let rechazo = document.getElementById("rechazo").value;
  let antecedentes = document.getElementById("antecedentes").value;

  let score = 0;
  let diagnostico = "";

  if (pasaporte === "si") score += 30;
  if (rechazo === "no") score += 30;
  if (antecedentes === "no") score += 40;

  if (score >= 80) {
    diagnostico = "Aprobación probable";
  } else if (score >= 50) {
    diagnostico = "Revisión adicional posible";
  } else {
    diagnostico = "Alto riesgo de rechazo";
  }

  if (edad < 18 || edad > 70) {
    diagnostico += " | Exento de pago";
  }

  document.getElementById("resultado").innerText = diagnostico;

  // Enviar email
  emailjs.send("service_hxuq7gn", "template_r225rld", {
    to_email: email,
    message: diagnostico,
    edad: edad,
    score: score
  });
}
</script>

</body>
</html>
